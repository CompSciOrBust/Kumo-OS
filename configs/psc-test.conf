# psc_test against psc: sm and pm (with fs, which pm expects; psc itself needs
# only sm), psc, and the test KIP, which reports on the debug log. No programs
# and no network. scripts/run-psc-test.sh runs the same test without fs.
module atmosphere/sm
module atmosphere/pm
module fs
module psc
module psc_test
size 1G
