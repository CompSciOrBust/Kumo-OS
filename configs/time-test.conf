# time_test against the time services: sm and pm (with fs, which pm expects),
# bsdsockets (for the SNTP client in psc), psc (the time core: time:m, time:s,
# time:su, time:al, time:p), glue (time:u, time:a, time:r) and the test KIP,
# which reports on the debug log. No programs. scripts/run-time-test.sh runs
# the same test in its own image.
module atmosphere/sm
module atmosphere/pm
module fs
module bsdsockets
module psc
module glue
module time_test
size 1G
