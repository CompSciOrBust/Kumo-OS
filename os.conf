# The default OS configuration, read by scripts/build-os.py (make os).
#
# One module per line. "atmosphere/<name>" is a system module from
# vendor/atmosphere/stratosphere; a bare name is one from sysmodules/, or a
# test module from sysmodules/tests/.
# Whether a module is a KIP (started by the kernel) or a program (packaged as
# NCAs and started by pm and the loader) is read from its build files.

# Core services. Every configuration needs sm, pm and fs.
module atmosphere/sm        # service manager
module atmosphere/pm        # process manager
module fs                   # filesystem service
module atmosphere/spl       # secure-monitor front end; ncm and loader wait for it
module atmosphere/ncm       # content manager and location resolver
module atmosphere/loader    # creates processes from installed programs

# Networking.
module bsdsockets           # BSD sockets (bsd:u, bsd:s)
module nifm                 # NIFM, used to get device network status

# Starts the programs marked "boot" below, in the order listed.
module launcher

# Programs, installed on SYSTEM as NCAs.
module hello_program boot

# Relocatable objects, needed to load NRO files
module atmosphere/ro boot

# Image.
size 1G
